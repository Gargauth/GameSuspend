[package]
name = "gamesuspend"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Uspí a probudí hru v popředí jednou klávesovou zkratkou."
license = "MIT"
repository = "https://github.com/Gargauth/GameSuspend"
publish = false

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[package.metadata.winresource]
ProductName = "GameSuspend"
FileDescription = "GameSuspend"
OriginalFilename = "GameSuspend.exe"
LegalCopyright = "MIT License"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
